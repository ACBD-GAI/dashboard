<style>

*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#333}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(135deg,#2196f3,#1976d2);color:#fff;position:sticky;top:0;z-index:1000}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{width:48px;height:48px;border-radius:10px;background:#fff;padding:4px}
.header-right{display:flex;gap:10px;flex-wrap:wrap}
.header button{padding:10px 14px;border:none;border-radius:10px;background:#fff;color:#1976d2;font-weight:bold;cursor:pointer}
.container{padding:20px}
.filters{display:grid;grid-template-columns:220px 220px 1fr 140px;gap:15px;align-items:end;background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column}
label{font-weight:bold;margin-bottom:6px}
select,input{padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}
#searchBtn{padding:12px;border:none;border-radius:10px;background:#2196f3;color:#fff;font-weight:bold;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center;border-left:6px solid #2196f3}
.card h3{margin:0;color:#666;font-size:16px}.card h1{margin:10px 0 0;font-size:34px;color:#1976d2}
.table-container{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th{background:#1976d2;color:#fff;padding:12px;text-align:left;position:sticky;top:0}
td{padding:12px;border-bottom:1px solid #eee}
tr:hover{background:#f5faff}
.pagination{display:flex;justify-content:center;align-items:center;gap:15px;margin:20px 0}
.pagination button{padding:10px 18px;border:none;border-radius:10px;background:#2196f3;color:#fff;cursor:pointer}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;justify-content:center;align-items:center}
.loader{width:50px;height:50px;border:5px solid #ddd;border-top:5px solid #2196f3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){
.filters{grid-template-columns:1fr}
.summary{grid-template-columns:1fr 1fr}
.header{flex-direction:column;gap:10px}
.header-right{justify-content:center}
}
@media(max-width:600px){
.summary{grid-template-columns:1fr}
th,td{font-size:13px}
}

async function verifyOTP(){

function setUIScanning(state) {
  const btn = document.getElementById("scanBtn");
  const siBox = document.getElementById("siNo");
  const reader = document.getElementById("reader");
  const refreshBtn = document.getElementById("refreshBtn");

  if (state) {
    btn.innerHTML = "⛔ STOP SCANNING";
    siBox.disabled = true;
    reader.style.display = "block";
    refreshBtn.disabled = true;
    refreshBtn.style.opacity = "0.5";
  } else {
    btn.innerHTML = "📷 START SCAN";
    siBox.disabled = false;
    reader.style.display = "none";
    refreshBtn.disabled = false;
    refreshBtn.style.opacity = "1";
  }
}



async function toggleScan() {
  const siNo = document.getElementById("siNo").value;
  if (!siNo) return alert("Enter SI No");

  if (isScanning) {
    isScanning = false;
    setUIScanning(false);
    if (scanner) {
      await scanner.stop();
      await scanner.clear();
      scanner = null;
    }
    return;
  }

  clearUI();
  isScanning = true;
  setUIScanning(true);

const devices = await Html5Qrcode.getCameras();

if(!devices.length){
  alert("No camera detected");
  isScanning = false;
  setUIScanning(false);
  return;
}

let cameraId = devices[0].id;

for (let d of devices) {
  const label = (d.label || "").toLowerCase();

  if (label.includes("back") || label.includes("rear")) {
    cameraId = d.id;
    break;
  }
}

 scanner = new Html5Qrcode("reader");

await scanner.start(
    {
        deviceId: { exact: cameraId }
    },
    {
        fps: 20,
        qrbox: {
            width: 300,
            height: 300
        },
        aspectRatio: 1.0,
        videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }
    },
    async (code) => {

        if (!isScanning) return;

        isScanning = false;
        await scanner.stop();
        await scanner.clear();
        scanner = null;
        setUIScanning(false);

        beep();
        vibrate();

        tempCode = code;
        tempSi = siNo;

        const res = await fetch(
            API_URL +
            "?action=check" +
            "&barcode=" + encodeURIComponent(code) +

        );

        const data = await res.json();

        let row = data.row || [];

        if (data.status === "FOUND") {
            document.getElementById("result").innerHTML = `
                <div class="card green scan-animate">
                    ✅ AVAILABLE<br><br>
                    <b>${colO}</b><br>
                    ${colJ ? `<small>${colJ}</small><br>` : ""}

                        onclick="cancelNo()">

                    </button>
                </div>
            `;
        }
        else if (data.status === "DUPLICATE") {
            document.getElementById("result").innerHTML = `
                <div class="card red">
                    🛑 ALREADY SOLD<br><br>
                    <b>${colO}</b><br>
                    ${colJ ? `<small>${colJ}</small><br>` : ""}
                    <b>${code}</b>
                </div>
            `;
        }
        else {
            document.getElementById("result").innerHTML = `
                <div class="no-results">
                    ❌ NOT FOUND
                </div><br>
                <b>${colO}</b><br>
                ${colJ ? `<small>${colJ}</small>` : ""}
            `;
        }
    }
);

// ================= CAMERA IMPROVEMENTS =================

try {

    const video = document.querySelector("#reader video");

    if (video && video.srcObject) {

        const track = video.srcObject.getVideoTracks()[0];

        if (track) {

            const capabilities = track.getCapabilities();

            // Continuous autofocus
            if (

            ) {

       if (capabilities.zoom) {

        advanced: [{
            zoom: desiredZoom
        }]
    });

                console.log("Camera zoom enabled");
            }

        }

    }

}
catch (e) {

    console.log("Camera features not supported:", e);

}
}

return;

  return;

  // ================= START AUDIT =================

 auditQueue.length = 0;
auditProcessing = false;
auditRecent.clear();

auditCount = 0;

document.getElementById("auditCounter").style.display = "block";

document.getElementById("auditCounter").innerHTML =
"Scanned : 0";


  btn.innerHTML = "⏹ STOP AUDIT";


  scanBtn.disabled = true;

    return;

  }



  let cameraId = cameras[0].id;



  for(let cam of cameras){

    if(label.includes("back") || label.includes("rear")){

      cameraId=cam.id;
      break;

    }

  }



  auditScanner = new Html5Qrcode("auditReader");



  try {


    await auditScanner.start(

        }

        qrbox:{
          width:300,

        },

          facingMode:"environment",

          },

          height:{
            ideal:1080
          }

        }

      },


     async (decodedText) => {

    if (!auditScanning) return;

    const barcode = decodedText.trim().toUpperCase();

    // Ignore same barcode within 2 seconds
    const now = Date.now();
    const last = auditRecent.get(barcode) || 0;

    if (now - last < 2000) return;

    auditRecent.set(barcode, now);

    // Cleanup old entries
    for (const [k, t] of auditRecent) {
        if (now - t > 10000) {
            auditRecent.delete(k);
        }
    }

    // Immediate feedback
    beep();
    vibrate();

    // Don't queue the same barcode twice
if (!auditQueue.includes(barcode)) {
    auditQueue.push(barcode);
    processAuditQueue();
}

}

);      



    // CAMERA AUTO FOCUS + ZOOM

                }

          }


        }

      }

      );

    );


    alert(

    );


    auditScanning=false;

    btn.innerHTML="🔄 RE-INVENTORY";


    document.getElementById("auditReader").style.display="none";
    document.getElementById("auditCounter").style.display = "none";


  }


}

async function processAuditQueue(){

    // Already processing?
    if(auditProcessing) return;

    auditProcessing = true;

    while(auditQueue.length > 0 && auditScanning){

        const barcode = auditQueue.shift();

        try{

            // Check item
           const saveRes = await fetch(
    API_URL +
    "?action=saveAudit" +
    "&barcode=" + encodeURIComponent(barcode) +
    getSessionParams()

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 900;
  gain.gain.value = 0.15;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
}
