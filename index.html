<!DOCTYPE html>
<html lang="en">



 


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INV DASHBOARD</title>
<link rel="stylesheet" href="style.css">

<style>

*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#333}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(135deg,#2196f3,#1976d2);color:#fff;position:sticky;top:0;z-index:1000}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{width:48px;height:48px;border-radius:10px;background:#fff;padding:4px}
.header-right{display:flex;gap:10px;flex-wrap:wrap}
.header button{padding:10px 14px;border:none;border-radius:10px;background:#fff;color:#1976d2;font-weight:bold;cursor:pointer}
.container{padding:20px}
.filters{display:grid;grid-template-columns:220px 220px 1fr 140px;gap:15px;align-items:end;background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column}
label{font-weight:bold;margin-bottom:6px}
select,input{padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}
#searchBtn{padding:12px;border:none;border-radius:10px;background:#2196f3;color:#fff;font-weight:bold;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center;border-left:6px solid #2196f3}
.card h3{margin:0;color:#666;font-size:16px}.card h1{margin:10px 0 0;font-size:34px;color:#1976d2}
.table-container{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th{background:#1976d2;color:#fff;padding:12px;text-align:left;position:sticky;top:0}
td{padding:12px;border-bottom:1px solid #eee}
tr:hover{background:#f5faff}
.pagination{display:flex;justify-content:center;align-items:center;gap:15px;margin:20px 0}
.pagination button{padding:10px 18px;border:none;border-radius:10px;background:#2196f3;color:#fff;cursor:pointer}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;justify-content:center;align-items:center}
.loader{width:50px;height:50px;border:5px solid #ddd;border-top:5px solid #2196f3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){
.filters{grid-template-columns:1fr}
.summary{grid-template-columns:1fr 1fr}
.header{flex-direction:column;gap:10px}
.header-right{justify-content:center}
}
@media(max-width:600px){
.summary{grid-template-columns:1fr}
th,td{font-size:13px}
}


.header button,
#searchBtn,
#verifyBtn,
button {
    transition: all .2s ease;
}

.header button:hover,
#searchBtn:hover,
#verifyBtn:hover,
button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    filter:brightness(1.05);
}

.header button:active,
#searchBtn:active,
#verifyBtn:active,
button:active{
    transform:scale(.97);
}
 

  
</style>
 </head>
  
<body>
 <div id="loginScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#eef2f7;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
">

<div style="
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
width:340px;
">

<h2>🔐 ADMIN LOGIN</h2>

<p>Dashboard Access</p>

<input
id="email"
type="email"
placeholder="Enter Gmail"
style="
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
">

<button
style="
width:100%;
padding:14px;
background:#2196f3;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
"
onclick="sendOTP()">
SEND OTP
</button>

<input
id="otp"
placeholder="Enter OTP"
style="
display:none;
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
">

<button
id="verifyBtn"
style="
display:none;
width:100%;
padding:14px;
margin-top:15px;
background:#2196f3;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
"
onclick="verifyOTP()">
VERIFY OTP
</button>

<p id="loginStatus"></p>

</div>

 </div>
 
  

<div id="app" style="display:none;">

<header class="header">
  <div class="header-left">
    <img src="https://drive.google.com/thumbnail?id=1U9kmQ7qummOCpVppdLtmVaugMuzLYUWQ&sz=w200">
    <div>
      <h2>ACEBEDO OPTICAL INVENTORY</h2>
      <small>Central Inventory Management</small>
    </div>
  </div>

  <div class="header-right">
    <button id="refreshBtn">🔄 Refresh</button>
    <button id="exportBtn">📥 Export</button>
    <button id="reportBtn">📧 Report</button>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main class="container">

<section class="filters">

<div class="field">
<label>Branch</label>
<select id="branchSelect">
<option value="ALL">🌐 All Branches</option>
<option value="GAI">🏢 Gaisano Iloilo</option>
<option value="CAS">🏢 Casa Plaza</option>
<option value="BAC">🏢 Bacolod</option>
</select>
</div>

<div class="field">
<label>Select Sheet</label>
<select id="sheetSelect">
<option value="stocks">📦 Stocks</option>
<option value="SCANRESULTS">💰 Sold Out</option>
<option value="AUDIT">🔄 Re-Inventory</option>
</select>
</div>

<div class="field search">
<label>Search</label>
<input id="searchBox" placeholder="Tag, SI, Description">
</div>

<button id="searchBtn">🔍 Search</button>

</section>

<section class="summary">

<div class="card">
<h3>Total Stocks</h3>
<h1 id="stockCount">0</h1>
</div>

<div class="card">
<h3>Sold Out</h3>
<h1 id="soldCount">0</h1>
</div>

<div class="card">
<h3>Audited</h3>
<h1 id="auditCount">0</h1>
</div>

<div class="card">
<h3>Showing</h3>
<h1 id="showingCount">0</h1>
</div>

</section>

<section class="table-container">

<table id="resultTable">

<thead>
<tr>
<th>Branch</th>
<th>Description</th>
<th>Tag</th>
<th>SI</th>

<th>Date</th>
</tr>
</thead>
 
<tbody id="tableBody">

<tr>
<td colspan="5" style="text-align:center;padding:40px;">
No data loaded.
</td>
</tr>

</tbody>

</table>

</section>

<div class="pagination">
<button id="prevBtn">◀ Previous</button>
<span id="pageInfo">Page 1</span>
<button id="nextBtn">Next ▶</button>
</div>

</main>

<div id="loading" style="display:none">
<div class="loader"></div>
<p>Loading data...</p>
</div>



</div>

  
<SCRIPT>



const SESSION_KEY = "inventorySession";


const API_URL = "https://script.google.com/macros/s/AKfycbzltdna0QV2k3qiRe0TiSX01aNX5rpsLtM8ef1aHgW4xvqqAhKGmTD03RgM2zMut2aBTw/exec";



/* ================= LOGIN ================= */

async function sendOTP(){

    const email=document.getElementById("email").value.trim();
 const status = document.getElementById("loginStatus");

    if(!email){
       
status.style.color="#dc3545";
status.innerHTML="❌ Enter your Gmail.";
return;
     
    }


    try{

        const url =
        API_URL+
        "?action=sendOTP&email="+encodeURIComponent(email);


    

status.style.color = "#1976d2";
status.innerHTML = "⏳ Sending OTP...";


        const res = await fetch(url);


      const text = await res.text();
console.log("SEND OTP:", text);

let data;
try{
    data = JSON.parse(text);
}catch(e){
    status.style.color="#dc3545";
    status.innerHTML="❌ Server returned invalid response.";
    console.error(text);
    return;
}



        if(data.status==="OTP_SENT"){




status.style.color = "#28a745";
status.innerHTML = "✅ OTP sent. Please check your Gmail.";


            document.getElementById("otp").style.display="block";


            document.getElementById("verifyBtn").style.display="block";


            document.getElementById("otp").focus();


        }
        else if(data.status==="EMAIL_DENIED"){


         

status.style.color = "#dc3545";
status.innerHTML = "❌ This Gmail is not authorized.";

        }
        else{


         

status.style.color = "#dc3545";
status.innerHTML = "❌ " + (data.message || "Unable to send OTP.");


        }


    }
    catch(err){

    
status.style.color="#dc3545";
status.innerHTML="❌ Unable to connect to server.";
console.error(err);
    }

}
async function verifyOTP(){

    const verifyBtn=document.getElementById("verifyBtn");
    const status=document.getElementById("loginStatus");

    try{

        verifyBtn.disabled=true;
        verifyBtn.textContent="VERIFYING...";

        status.style.color="#1976d2";
        status.innerHTML="⏳ Verifying OTP...";

        const email=document.getElementById("email").value.trim();
        const otp=document.getElementById("otp").value.trim();

        const res=await fetch(
            API_URL+
            "?action=verifyOTP"+
            "&email="+encodeURIComponent(email)+
            "&otp="+encodeURIComponent(otp)
        );

      const text = await res.text();
console.log(text);

const data = JSON.parse(text);

        verifyBtn.disabled=false;
        verifyBtn.textContent="VERIFY OTP";

        if(data.status==="OK"){

            status.style.color="#28a745";
            status.innerHTML="✅ Login successful.";

            localStorage.setItem(
                SESSION_KEY,
                JSON.stringify({
                    email:email,
                    sessionId:data.sessionId
                })
            );

            localStorage.setItem("loginTime",Date.now());

            document.getElementById("loginScreen").style.display="none";
            document.getElementById("app").style.display="block";

            loadDashboard();

        }else{

            status.style.color="#dc3545";
            status.innerHTML="❌ Invalid or expired OTP.";

        }

    }catch(err){

        verifyBtn.disabled=false;
        verifyBtn.textContent="VERIFY OTP";

        status.style.color="#dc3545";
        status.innerHTML="❌ Unable to connect to server.";

        console.error(err);

    }

}

async function logout(){

  const session =
JSON.parse(
    localStorage.getItem(SESSION_KEY)
    || "{}"
);

    try{

        await fetch(
            API_URL+
            "?action=logout"+
            "&email="+encodeURIComponent(session.email||"")+
            "&sessionId="+encodeURIComponent(session.sessionId||"")
        );

    }catch(e){}

    localStorage.removeItem(SESSION_KEY);
localStorage.removeItem("loginTime");

location.reload();

}

function getSessionParams(){

    const session =
    JSON.parse(
        localStorage.getItem(SESSION_KEY)
        || "{}"
    );

    return (
        "&email=" + encodeURIComponent(session.email || "") +
        "&sessionId=" + encodeURIComponent(session.sessionId || "")
    );

}

function checkLoginExpiry(){

    const loginTime=
    Number(localStorage.getItem("loginTime")||0);

    if(!loginTime)return;

    const thirteenHours=
    13*60*60*1000;

    if(Date.now()-loginTime>thirteenHours){

        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem("loginTime");

       document.getElementById("loginStatus").style.color="#dc3545";
document.getElementById("loginStatus").innerHTML="❌ Session expired.";

location.reload();

     

    }

}

window.addEventListener("DOMContentLoaded",async()=>{

    checkLoginExpiry();

  const session =
JSON.parse(
    localStorage.getItem(SESSION_KEY)
    || "{}"
);

    if(!session.email){

        document.getElementById("loginScreen").style.display="flex";
        document.getElementById("app").style.display="none";

        return;

    }

    try{

        const res=await fetch(
            API_URL+
            "?action=checkSession"+
            "&email="+encodeURIComponent(session.email)+
            "&sessionId="+encodeURIComponent(session.sessionId)
        );

        const text = await res.text();

console.log("CHECK SESSION RESPONSE:",text);

const data = JSON.parse(text);

        if(data.status==="VALID"){

            document.getElementById("loginScreen").style.display="none";
            document.getElementById("app").style.display="block";

            loadDashboard();

        }else{

            localStorage.removeItem(SESSION_KEY);
            localStorage.removeItem("loginTime");

            document.getElementById("loginScreen").style.display="flex";
            document.getElementById("app").style.display="none";

        }

    }
    catch(e){

    console.error("SESSION ERROR:",e);

    

    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("app").style.display="none";

}

});

document.getElementById("logoutBtn").onclick=logout;

document.getElementById("email").addEventListener("keydown",e=>{
    if(e.key==="Enter")sendOTP();
});

document.getElementById("otp").addEventListener("keydown",e=>{
    if(e.key==="Enter")verifyOTP();
});

/* ================= DASHBOARD ================= */

async function loadDashboard(){

    const branch =
    document.getElementById("branchSelect").value;

    const sheet =
    document.getElementById("sheetSelect").value;

    document.getElementById("loading").style.display="flex";

    try{



const search =
document.getElementById("searchBox").value.trim();


const res = await fetch(
API_URL+
"?action=summary"+
"&branch="+encodeURIComponent(branch)+
"&sheet="+encodeURIComponent(sheet)+
"&search="+encodeURIComponent(search)+
getSessionParams()
);

        const text = await res.text();

        console.log("SERVER RESPONSE:", text);

        const data = JSON.parse(text);


        if(data.status !== "OK"){

            console.error(data.message || "Server error");

            return;
        }


        renderTable(data.data);


        if(sheet==="stocks"){

document.getElementById("stockCount").textContent =
data.total;

}


if(sheet==="SCANRESULTS"){

document.getElementById("soldCount").textContent =
data.total;

}


if(sheet==="AUDIT"){

document.getElementById("auditCount").textContent =
data.total;

}


       document.getElementById("stockCount").textContent =
    sheet==="stocks" ? data.total : 0;

document.getElementById("soldCount").textContent =
    sheet==="SCANRESULTS" ? data.total : 0;

document.getElementById("auditCount").textContent =
    sheet==="AUDIT" ? data.total : 0;


        document.getElementById("showingCount").textContent =
        data.data.length;


    }catch(err){

        console.error("DASHBOARD ERROR:",err);

      console.error(err);
     
    }
    
    
    
    finally{

        document.getElementById("loading").style.display="none";

    }

}

function renderTable(rows){

    const body=document.getElementById("tableBody");

    if(!rows || rows.length===0){
        body.innerHTML=`
        <tr>
            <td colspan="5" style="text-align:center;padding:40px">
                No data found.
            </td>
        </tr>`;
        return;
    }

    body.innerHTML=rows.map(r=>`
        <tr>
            <td>${r.branch}</td>
            <td>${r.description}</td>
            <td>${r.tag}</td>
            <td>${r.si}</td>
            <td>${r.date}</td>
        </tr>
    `).join("");
}



// BUTTON EVENTS

document.getElementById("searchBtn").onclick =
loadDashboard;


document.getElementById("refreshBtn").onclick =
loadDashboard;


document.getElementById("branchSelect").onchange =
loadDashboard;


document.getElementById("sheetSelect").onchange =
loadDashboard;


 document.getElementById("searchBox")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){
loadDashboard();
}

});


  
  


 
</SCRIPT>  
</body>
</html>
