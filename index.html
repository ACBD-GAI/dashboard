<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaisano Inventory Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<style>

*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#333}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(135deg,#2196f3,#1976d2);color:#fff;position:sticky;top:0;z-index:1000}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{width:48px;height:48px;border-radius:10px;background:#fff;padding:4px}
.header-right{display:flex;gap:10px;flex-wrap:wrap}
.header button{padding:10px 14px;border:none;border-radius:10px;background:#fff;color:#1976d2;font-weight:bold;cursor:pointer}
.container{padding:20px}
.filters{display:grid;grid-template-columns:220px 220px 1fr 140px;gap:15px;align-items:end;background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column}
label{font-weight:bold;margin-bottom:6px}
select,input{padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}
#searchBtn{padding:12px;border:none;border-radius:10px;background:#2196f3;color:#fff;font-weight:bold;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center;border-left:6px solid #2196f3}
.card h3{margin:0;color:#666;font-size:16px}.card h1{margin:10px 0 0;font-size:34px;color:#1976d2}
.table-container{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th{background:#1976d2;color:#fff;padding:12px;text-align:left;position:sticky;top:0}
td{padding:12px;border-bottom:1px solid #eee}
tr:hover{background:#f5faff}
.pagination{display:flex;justify-content:center;align-items:center;gap:15px;margin:20px 0}
.pagination button{padding:10px 18px;border:none;border-radius:10px;background:#2196f3;color:#fff;cursor:pointer}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;justify-content:center;align-items:center}
.loader{width:50px;height:50px;border:5px solid #ddd;border-top:5px solid #2196f3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){
.filters{grid-template-columns:1fr}
.summary{grid-template-columns:1fr 1fr}
.header{flex-direction:column;gap:10px}
.header-right{justify-content:center}
}
@media(max-width:600px){
.summary{grid-template-columns:1fr}
th,td{font-size:13px}
}


  
</style>
  
<body>

<header class="header">
  <div class="header-left">
    <img src="logo.png" alt="Logo">
    <div>
      <h2>GAISANO INVENTORY DASHBOARD</h2>
      <small>Central Inventory Management</small>
    </div>
  </div>

  <div class="header-right">
    <button id="refreshBtn">🔄 Refresh</button>
    <button id="exportBtn">📥 Export</button>
    <button id="reportBtn">📧 Report</button>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main class="container">

<section class="filters">

<div class="field">
<label>Branch</label>
<select id="branchSelect">
<option value="ALL">🌐 All Branches</option>
<option value="GAI">🏢 Gaisano Iloilo</option>
<option value="CAS">🏢 Casa Plaza</option>
<option value="BAC">🏢 Bacolod</option>
</select>
</div>

<div class="field">
<label>Sheet</label>
<select id="sheetSelect">
<option value="stocks">📦 Stocks</option>
<option value="SCANRESULTS">💰 Sold Out</option>
<option value="AUDIT">🔄 Re-Inventory</option>
</select>
</div>

<div class="field search">
<label>Search</label>
<input id="searchBox" placeholder="Barcode, Tag, SI, Description">
</div>

<button id="searchBtn">🔍 Search</button>

</section>

<section class="summary">

<div class="card">
<h3>Total Stocks</h3>
<h1 id="stockCount">0</h1>
</div>

<div class="card">
<h3>Sold Out</h3>
<h1 id="soldCount">0</h1>
</div>

<div class="card">
<h3>Audited</h3>
<h1 id="auditCount">0</h1>
</div>

<div class="card">
<h3>Showing</h3>
<h1 id="showingCount">0</h1>
</div>

</section>

<section class="table-container">

<table id="resultTable">

<thead>
<tr>
<th>Branch</th>
<th>Barcode</th>
<th>Description</th>
<th>Tag</th>
<th>SI</th>
<th>Qty</th>
<th>Date</th>
</tr>
</thead>

<tbody id="tableBody">

<tr>
<td colspan="7" style="text-align:center;padding:40px;">
No data loaded.
</td>
</tr>

</tbody>

</table>

</section>

<div class="pagination">
<button id="prevBtn">◀ Previous</button>
<span id="pageInfo">Page 1</span>
<button id="nextBtn">Next ▶</button>
</div>

</main>

<div id="loading" style="display:none">
<div class="loader"></div>
<p>Loading data...</p>
</div>

<script src="script.js"></script>

</body>
</html>
